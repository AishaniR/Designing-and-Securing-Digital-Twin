services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped

    ports:
      - "8883:8883"
      - "1883:1883"

    volumes:
      - ./config:/mosquitto/config:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log

    networks:
      - ditto-network

networks:
  ditto-network:
    external: true
    name: docker_default